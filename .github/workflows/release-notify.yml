name: ReleaseNotify

on:
  push:
    branches:
      - master
    paths:
      - Project/Engine/Src/EngineSystem/EngineVersion.h
  workflow_dispatch:
    inputs:
      version:
        description: 送る版（例 0.49.0。空なら今の版）
        required: false
        default: ''

concurrency:
  group: release-notify
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /Project/Engine/Src/EngineSystem/EngineVersion.h
            /Project/Engine/Docs/index.html

      - name: Notify Discord
        env:
          BEFORE_SHA: ${{ github.event.before }}
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
        run: node .github/scripts/notify-release.mjs

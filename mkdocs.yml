site_name: CoreEngine ゲーム制作ガイド
site_description: CoreEngine でゲームを作るための手引き。エディタの使い方とスクリプトの書き方。
docs_dir: Docs/GameDevGuide
site_dir: GameDevGuide_Site

# site_url は書かないこと。書くと privacy プラグインが mermaid を絶対 URL 参照にして、
# file:// で開いたときに図が出なくなる
use_directory_urls: false

theme:
  name: material
  language: ja
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 暗い配色にする
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 明るい配色にする
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ja
  - privacy
  - offline

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 日本語の見出しは既定の slugify だと _1 _2 の連番になり、見出しへのリンクが全部切れる
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: ["Docs/GameDevGuide"]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - はじめに: index.md
  - 最初の一歩:
      - 起動してみる: start/first-run.md
      - エディタの画面: start/editor-tour.md
      - オブジェクトを置く: start/place-object.md
  - チュートリアル:
      - 1. 玉を転がす: tutorial/01-ball.md
      - 2. キャラを動かす: tutorial/02-character.md
      - 3. 集めて数える: tutorial/03-collect.md
      - 4. 画面に出す: tutorial/04-ui.md
      - 5. タイトルと設定: tutorial/05-title.md
  - エディタ:
      - ヒエラルキーとインスペクタ: editor/hierarchy-inspector.md
      - ギズモとカメラ: editor/gizmo-camera.md
      - Project とアセット: editor/project-assets.md
      - プレハブ: editor/prefab.md
      - シーン: editor/scene.md
      - コンソール: editor/console.md
      - 設定: editor/settings.md
  - スクリプト:
      - 書き方の基本: script/basics.md
      - インスペクタに出す: script/inspector.md
      - 他のものを触る: script/references.md
      - 入力: script/input.md
      - 物理と当たり判定: script/physics.md
      - UI: script/ui.md
      - 音: script/audio.md
      - 時間・動き・乱数: script/time-tween.md
      - シーンとセーブ: script/scene-save.md
      - エラーの直し方: script/errors.md
  - リファレンス:
      - コンポーネント一覧: reference/components.md
      - スクリプト API: reference/script-api.md
      - 入力アクション: reference/input-actions.md
      - ショートカット: reference/shortcuts.md

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" width="100%">
  <title id="t">エディタの画面</title>
  <desc id="d">メニュー・ツールバー・ヒエラルキー・ゲーム画面・インスペクタ・下段パネル</desc>
  <style>
    :root {
      --fig-line: #5a6270; --fig-text: #1f2430; --fig-weak: #6b7382;
      --fig-fill: #eef1f6; --fig-accent: #4257b2; --fig-accent-fill: #dfe4f7;
      --fig-warn: #a8620f; --fig-warn-fill: #fbeedd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-line: #8b93a3; --fig-text: #e6e9ef; --fig-weak: #a6adbb;
        --fig-fill: #2a2f3a; --fig-accent: #a7b4ef; --fig-accent-fill: #313a5c;
        --fig-warn: #e5b578; --fig-warn-fill: #453722;
      }
    }
    .bx { fill: var(--fig-fill); stroke: var(--fig-line); stroke-width: 1.2; }
    .bx-a { fill: var(--fig-accent-fill); stroke: var(--fig-accent); stroke-width: 1.4; }
    .bx-w { fill: var(--fig-warn-fill); stroke: var(--fig-warn); stroke-width: 1.4; }
    .t { fill: var(--fig-text); font-family: system-ui, sans-serif; font-size: 13px; }
    .t-b { fill: var(--fig-text); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .t-s { fill: var(--fig-weak); font-family: system-ui, sans-serif; font-size: 11.5px; }
    .t-a { fill: var(--fig-accent); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .ln { stroke: var(--fig-line); stroke-width: 1.3; fill: none; }
    .ln-d { stroke: var(--fig-line); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--fig-line)"/>
    </marker>
  </defs>

  <rect class="bx" x="20" y="14" rx="6" width="680" height="30"/>
  <text class="t" x="360" y="33" text-anchor="middle">メニューバー  File / Edit / GameObject / Component / Assets / Window / Help</text>
  <rect class="bx-a" x="20" y="52" rx="6" width="680" height="30"/>
  <text class="t" x="360" y="71" text-anchor="middle">ツールバー  ▶ 再生・ギズモ（移動 / 回転 / 拡縮）・Grid・Collider</text>
  <rect class="bx" x="20" y="94" rx="6" width="160" height="160"/>
  <text class="t-b" x="100" y="170" text-anchor="middle">ヒエラルキー</text>
  <text class="t-s" x="100" y="186" text-anchor="middle">シーンにあるもの</text>
  <rect class="bx-a" x="192" y="94" rx="6" width="330" height="160"/>
  <text class="t-b" x="357" y="162" text-anchor="middle">Game / Canvas</text>
  <text class="t-s" x="357" y="178" text-anchor="middle">ゲームの画面</text>
  <text class="t-s" x="357" y="194" text-anchor="middle">ここで選んで動かす</text>
  <rect class="bx" x="534" y="94" rx="6" width="166" height="160"/>
  <text class="t-b" x="617" y="162" text-anchor="middle">インスペクタ</text>
  <text class="t-s" x="617" y="178" text-anchor="middle">選んだものの</text>
  <text class="t-s" x="617" y="194" text-anchor="middle">中身</text>
  <rect class="bx" x="20" y="264" rx="6" width="680" height="56"/>
  <text class="t-b" x="360" y="288" text-anchor="middle">Project / Console / Profiler</text>
  <text class="t-s" x="360" y="304" text-anchor="middle">アセット・ログ・処理時間</text>
  <text class="t-s" x="360" y="344" text-anchor="middle">左で選び、中央で動かし、右で値を決める</text>
</svg>

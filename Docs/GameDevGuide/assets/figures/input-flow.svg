<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-labelledby="t d" width="100%">
  <title id="t">入力の流れ</title>
  <desc id="d">デバイスの入力が操作の名前にまとまり、場面で仕分けてスクリプトへ届く</desc>
  <style>
    :root {
      --fig-line: #5a6270; --fig-text: #1f2430; --fig-weak: #6b7382;
      --fig-fill: #eef1f6; --fig-accent: #4257b2; --fig-accent-fill: #dfe4f7;
      --fig-warn: #a8620f; --fig-warn-fill: #fbeedd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-line: #8b93a3; --fig-text: #e6e9ef; --fig-weak: #a6adbb;
        --fig-fill: #2a2f3a; --fig-accent: #a7b4ef; --fig-accent-fill: #313a5c;
        --fig-warn: #e5b578; --fig-warn-fill: #453722;
      }
    }
    .bx { fill: var(--fig-fill); stroke: var(--fig-line); stroke-width: 1.2; }
    .bx-a { fill: var(--fig-accent-fill); stroke: var(--fig-accent); stroke-width: 1.4; }
    .bx-w { fill: var(--fig-warn-fill); stroke: var(--fig-warn); stroke-width: 1.4; }
    .t { fill: var(--fig-text); font-family: system-ui, sans-serif; font-size: 13px; }
    .t-b { fill: var(--fig-text); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .t-s { fill: var(--fig-weak); font-family: system-ui, sans-serif; font-size: 11.5px; }
    .t-a { fill: var(--fig-accent); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .ln { stroke: var(--fig-line); stroke-width: 1.3; fill: none; }
    .ln-d { stroke: var(--fig-line); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--fig-line)"/>
    </marker>
  </defs>

  <rect class="bx" x="20" y="20" rx="6" width="130" height="40"/>
  <text class="t" x="85" y="44" text-anchor="middle">キーボード</text>
  <path class="ln" d="M150 40 H190.0 V105 H230" marker-end="url(#ar)"/>
  <rect class="bx" x="20" y="80" rx="6" width="130" height="40"/>
  <text class="t" x="85" y="104" text-anchor="middle">ゲームパッド</text>
  <path class="ln" d="M150 100 H190.0 V105 H230" marker-end="url(#ar)"/>
  <rect class="bx" x="20" y="140" rx="6" width="130" height="40"/>
  <text class="t" x="85" y="164" text-anchor="middle">マウス</text>
  <path class="ln" d="M150 160 H190.0 V105 H230" marker-end="url(#ar)"/>
  <rect class="bx-a" x="230" y="75" rx="6" width="180" height="60"/>
  <text class="t-b" x="320" y="101" text-anchor="middle">InputAction</text>
  <text class="t-s" x="320" y="117" text-anchor="middle">操作の名前</text>
  <path class="ln" d="M410 105 L460 105" marker-end="url(#ar)"/>
  <rect class="bx" x="460" y="68" rx="6" width="150" height="74"/>
  <text class="t" x="535" y="93" text-anchor="middle">場面で仕分け</text>
  <text class="t-s" x="535" y="109" text-anchor="middle">Game / UI</text>
  <text class="t-s" x="535" y="125" text-anchor="middle">Editor</text>
  <path class="ln" d="M610 105 L655 105" marker-end="url(#ar)"/>
  <rect class="bx-a" x="645" y="85" rx="6" width="100" height="40"/>
  <text class="t-b" x="695" y="109" text-anchor="middle">スクリプト</text>
  <text class="t-s" x="380" y="180" text-anchor="middle">キーを直接書かずに「操作の名前」で書くと、パッドも自動で効く</text>
</svg>

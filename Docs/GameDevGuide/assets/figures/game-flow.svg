<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" role="img" aria-labelledby="t d" width="100%">
  <title id="t">ゲーム全体の流れ</title>
  <desc id="d">タイトル・ゲーム・リザルト・設定をシーンで行き来する</desc>
  <style>
    .bx { fill: var(--fig-fill, #eef1f6); stroke: var(--fig-line, #5a6270); stroke-width: 1.2; }
    .bx-a { fill: var(--fig-accent-fill, #dfe4f7); stroke: var(--fig-accent, #4257b2); stroke-width: 1.4; }
    .bx-w { fill: var(--fig-warn-fill, #fbeedd); stroke: var(--fig-warn, #a8620f); stroke-width: 1.4; }
    .t { fill: var(--fig-text, #1f2430); font-family: system-ui, sans-serif; font-size: 13px; }
    .t-b { fill: var(--fig-text, #1f2430); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .t-s { fill: var(--fig-weak, #6b7382); font-family: system-ui, sans-serif; font-size: 11.5px; }
    .t-a { fill: var(--fig-accent, #4257b2); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .ln { stroke: var(--fig-line, #5a6270); stroke-width: 1.3; fill: none; }
    .ln-d { stroke: var(--fig-line, #5a6270); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--fig-line, #5a6270)"/>
    </marker>
  </defs>

  <rect class="bx-a" x="40" y="85" rx="6" width="130" height="48"/>
  <text class="t-b" x="105" y="113" text-anchor="middle">Title</text>
  <rect class="bx" x="280" y="20" rx="6" width="130" height="48"/>
  <text class="t-b" x="345" y="48" text-anchor="middle">Game</text>
  <rect class="bx" x="530" y="85" rx="6" width="130" height="48"/>
  <text class="t-b" x="595" y="113" text-anchor="middle">Result</text>
  <rect class="bx" x="280" y="150" rx="6" width="130" height="48"/>
  <text class="t-b" x="345" y="178" text-anchor="middle">Settings</text>
  <path class="ln" d="M170 100 H225.0 V40 H280" marker-end="url(#ar)"/>
  <text class="t-s" x="225" y="76" text-anchor="middle">はじめる</text>
  <path class="ln" d="M410 44 H470.0 V100 H530" marker-end="url(#ar)"/>
  <text class="t-s" x="480" y="60" text-anchor="middle">クリア</text>
  <path class="ln-d" d="M530 120 H470.0 V60 H410" marker-end="url(#ar)"/>
  <text class="t-s" x="480" y="140" text-anchor="middle">もう一度</text>
  <path class="ln" d="M170 120 H225.0 V174 H280" marker-end="url(#ar)"/>
  <text class="t-s" x="225" y="152" text-anchor="middle">設定</text>
</svg>

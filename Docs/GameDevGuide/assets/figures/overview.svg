<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-labelledby="t d" width="100%">
  <title id="t">全体の形</title>
  <desc id="d">シーンがオブジェクトを持ち、オブジェクトがコンポーネントを持つ</desc>
  <style>
    :root {
      --fig-line: #5a6270; --fig-text: #1f2430; --fig-weak: #6b7382;
      --fig-fill: #eef1f6; --fig-accent: #4257b2; --fig-accent-fill: #dfe4f7;
      --fig-warn: #a8620f; --fig-warn-fill: #fbeedd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fig-line: #8b93a3; --fig-text: #e6e9ef; --fig-weak: #a6adbb;
        --fig-fill: #2a2f3a; --fig-accent: #a7b4ef; --fig-accent-fill: #313a5c;
        --fig-warn: #e5b578; --fig-warn-fill: #453722;
      }
    }
    .bx { fill: var(--fig-fill); stroke: var(--fig-line); stroke-width: 1.2; }
    .bx-a { fill: var(--fig-accent-fill); stroke: var(--fig-accent); stroke-width: 1.4; }
    .bx-w { fill: var(--fig-warn-fill); stroke: var(--fig-warn); stroke-width: 1.4; }
    .t { fill: var(--fig-text); font-family: system-ui, sans-serif; font-size: 13px; }
    .t-b { fill: var(--fig-text); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .t-s { fill: var(--fig-weak); font-family: system-ui, sans-serif; font-size: 11.5px; }
    .t-a { fill: var(--fig-accent); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .ln { stroke: var(--fig-line); stroke-width: 1.3; fill: none; }
    .ln-d { stroke: var(--fig-line); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--fig-line)"/>
    </marker>
  </defs>

  <rect class="bx-a" x="20" y="118" rx="6" width="120" height="64"/>
  <text class="t-b" x="80" y="146" text-anchor="middle">シーン</text>
  <text class="t-s" x="80" y="162" text-anchor="middle">JSON</text>
  <rect class="bx" x="190" y="20" rx="6" width="130" height="64"/>
  <text class="t-b" x="255" y="56" text-anchor="middle">オブジェクト</text>
  <path class="ln" d="M140 150 H165.0 V52 H190" marker-end="url(#ar)"/>
  <rect class="bx" x="190" y="118" rx="6" width="130" height="64"/>
  <text class="t-b" x="255" y="154" text-anchor="middle">オブジェクト</text>
  <path class="ln" d="M140 150 H165.0 V150 H190" marker-end="url(#ar)"/>
  <rect class="bx" x="190" y="216" rx="6" width="130" height="64"/>
  <text class="t-b" x="255" y="252" text-anchor="middle">オブジェクト</text>
  <path class="ln" d="M140 150 H165.0 V248 H190" marker-end="url(#ar)"/>
  <rect class="bx" x="400" y="6" rx="6" width="160" height="38"/>
  <text class="t" x="480" y="29" text-anchor="middle">Transform</text>
  <path class="ln" d="M320 52 H360.0 V25 H400" marker-end="url(#ar)"/>
  <rect class="bx" x="400" y="58" rx="6" width="160" height="38"/>
  <text class="t" x="480" y="81" text-anchor="middle">MeshRenderer</text>
  <path class="ln" d="M320 52 H360.0 V77 H400" marker-end="url(#ar)"/>
  <rect class="bx" x="400" y="110" rx="6" width="160" height="38"/>
  <text class="t" x="480" y="133" text-anchor="middle">Rigidbody</text>
  <path class="ln" d="M320 52 H360.0 V129 H400" marker-end="url(#ar)"/>
  <rect class="bx" x="400" y="162" rx="6" width="160" height="38"/>
  <text class="t" x="480" y="185" text-anchor="middle">Collider</text>
  <path class="ln" d="M320 52 H360.0 V181 H400" marker-end="url(#ar)"/>
  <rect class="bx-a" x="400" y="222" rx="6" width="160" height="52"/>
  <text class="t-b" x="480" y="244" text-anchor="middle">自分の</text>
  <text class="t-b" x="480" y="260" text-anchor="middle">スクリプト</text>
  <path class="ln" d="M320 52 H360.0 V248 H400" marker-end="url(#ar)"/>
  <path class="ln-d" d="M560 248 H630 V25 H560" marker-end="url(#ar)"/>
  <path class="ln-d" d="M630 129 H560" marker-end="url(#ar)"/>
  <text class="t-s" x="646" y="130" text-anchor="start">読み書き</text>
</svg>

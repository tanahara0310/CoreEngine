<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="t d" width="100%">
  <title id="t">音の流れ</title>
  <desc id="d">AudioSource からバスを通ってマスターへ合流する</desc>
  <style>
    .bx { fill: var(--fig-fill, #eef1f6); stroke: var(--fig-line, #5a6270); stroke-width: 1.2; }
    .bx-a { fill: var(--fig-accent-fill, #dfe4f7); stroke: var(--fig-accent, #4257b2); stroke-width: 1.4; }
    .bx-w { fill: var(--fig-warn-fill, #fbeedd); stroke: var(--fig-warn, #a8620f); stroke-width: 1.4; }
    .t { fill: var(--fig-text, #1f2430); font-family: system-ui, sans-serif; font-size: 13px; }
    .t-b { fill: var(--fig-text, #1f2430); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .t-s { fill: var(--fig-weak, #6b7382); font-family: system-ui, sans-serif; font-size: 11.5px; }
    .t-a { fill: var(--fig-accent, #4257b2); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .ln { stroke: var(--fig-line, #5a6270); stroke-width: 1.3; fill: none; }
    .ln-d { stroke: var(--fig-line, #5a6270); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--fig-line, #5a6270)"/>
    </marker>
  </defs>

  <rect class="bx" x="20" y="20" rx="6" width="170" height="44"/>
  <text class="t" x="105" y="38" text-anchor="middle">AudioSource</text>
  <text class="t-s" x="105" y="54" text-anchor="middle">BGM</text>
  <path class="ln" d="M190 42 L258 42" marker-end="url(#ar)"/>
  <rect class="bx-a" x="258" y="20" rx="6" width="140" height="44"/>
  <text class="t" x="328" y="46" text-anchor="middle">BGM バス</text>
  <path class="ln" d="M398 42 H434.0 V105 H470" marker-end="url(#ar)"/>
  <rect class="bx" x="20" y="82" rx="6" width="170" height="44"/>
  <text class="t" x="105" y="100" text-anchor="middle">AudioSource</text>
  <text class="t-s" x="105" y="116" text-anchor="middle">効果音</text>
  <path class="ln" d="M190 104 L258 104" marker-end="url(#ar)"/>
  <rect class="bx-a" x="258" y="82" rx="6" width="140" height="44"/>
  <text class="t" x="328" y="108" text-anchor="middle">効果音バス</text>
  <path class="ln" d="M398 104 H434.0 V105 H470" marker-end="url(#ar)"/>
  <rect class="bx" x="20" y="144" rx="6" width="170" height="44"/>
  <text class="t" x="105" y="162" text-anchor="middle">AudioSource</text>
  <text class="t-s" x="105" y="178" text-anchor="middle">ボイス</text>
  <path class="ln" d="M190 166 L258 166" marker-end="url(#ar)"/>
  <rect class="bx-a" x="258" y="144" rx="6" width="140" height="44"/>
  <text class="t" x="328" y="170" text-anchor="middle">ボイスバス</text>
  <path class="ln" d="M398 166 H434.0 V105 H470" marker-end="url(#ar)"/>
  <rect class="bx-a" x="470" y="82" rx="6" width="110" height="46"/>
  <text class="t-b" x="525" y="109" text-anchor="middle">マスター</text>
  <path class="ln" d="M580 105 L628 105" marker-end="url(#ar)"/>
  <rect class="bx" x="618" y="85" rx="6" width="90" height="40"/>
  <text class="t" x="663" y="109" text-anchor="middle">スピーカー</text>
  <text class="t-s" x="360" y="205" text-anchor="middle">バス音量は、鳴っている音の本数に関係なくまとめて効く</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" role="img" aria-labelledby="t d" width="100%">
  <title id="t">スライダーの構造</title>
  <desc id="d">溝・伸びる帯・つまみの 3 つで作る</desc>
  <style>
    .bx { fill: var(--fig-fill, #eef1f6); stroke: var(--fig-line, #5a6270); stroke-width: 1.2; }
    .bx-a { fill: var(--fig-accent-fill, #dfe4f7); stroke: var(--fig-accent, #4257b2); stroke-width: 1.4; }
    .bx-w { fill: var(--fig-warn-fill, #fbeedd); stroke: var(--fig-warn, #a8620f); stroke-width: 1.4; }
    .t { fill: var(--fig-text, #1f2430); font-family: system-ui, sans-serif; font-size: 13px; }
    .t-b { fill: var(--fig-text, #1f2430); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .t-s { fill: var(--fig-weak, #6b7382); font-family: system-ui, sans-serif; font-size: 11.5px; }
    .t-a { fill: var(--fig-accent, #4257b2); font-family: system-ui, sans-serif; font-size: 13.5px; font-weight: 600; }
    .ln { stroke: var(--fig-line, #5a6270); stroke-width: 1.3; fill: none; }
    .ln-d { stroke: var(--fig-line, #5a6270); stroke-width: 1.2; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--fig-line, #5a6270)"/>
    </marker>
  </defs>

  <rect class="bx-a" x="40" y="30" rx="6" width="640" height="44"/>
  <text class="t" x="360" y="56" text-anchor="middle">VolumeTrack  —  RectTransform + UIImage + UISlider（当たり判定はここ）</text>
  <rect class="bx" x="40" y="110" rx="6" width="260" height="36"/>
  <text class="t" x="170" y="132" text-anchor="middle">VolumeFill</text>
  <text class="t-s" x="170" y="160" text-anchor="middle">値に合わせて伸びる帯</text>
  <rect class="bx-w" x="310" y="100" rx="6" width="70" height="56"/>
  <text class="t" x="345" y="132" text-anchor="middle">つまみ</text>
  <text class="t-s" x="345" y="182" text-anchor="middle">VolumeHandle</text>
  <path class="ln" d="M200 74 H185.0 V110 H170" marker-end="url(#ar)"/>
  <path class="ln" d="M400 74 H372.5 V100 H345" marker-end="url(#ar)"/>
  <text class="t-s" x="560" y="120" text-anchor="middle">帯とつまみは繋がなくても</text>
  <text class="t-s" x="560" y="136" text-anchor="middle">値は動く（見た目だけの役）</text>
</svg>
